name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The app is a Windows desktop build, so tests run on Windows where the
# filesystem, trash, and watcher behavior actually match the target platform.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
